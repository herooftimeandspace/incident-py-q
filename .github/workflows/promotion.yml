name: promotion

on:
  workflow_run:
    workflows: ["quality", "integration"]
    types: [completed]

permissions:
  contents: write
  checks: read
  pull-requests: write

jobs:
  promote-dev-to-staging:
    if: github.event.workflow_run.name == 'quality' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7  # TODO: pin to specific SHA for reproducibility
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7  # TODO: pin to specific SHA for reproducibility
        with:
          python-version: "3.14"

      - name: Create or refresh dev to staging promotion PR
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          # Authoring with github.token needs no stored credential. PRs it opens do not
          # trigger pull_request workflows, so the required `unit` and `integration`
          # checks are produced by the push to the head branch instead - checks are
          # scoped to the head commit, not to the event that created them.
          git fetch origin staging
          # The resolver shells out to gh, which reads GH_TOKEN/GITHUB_TOKEN.
          export GH_TOKEN="${GH_API_TOKEN}"
          resolved_label="$(python scripts/resolve_promotion_semver.py --repo "${GH_REPO}" --sha "${GH_SHA}" --base-ref dev)"
          existing_pr="$(gh pr list --repo "${GH_REPO}" --base staging --head dev --state open --json number --jq '.[0].number')"
          title="Promote dev to staging"
          body="$(printf '%s\n' \
            'Automated promotion PR from dev to staging.' \
            '' \
            "Source commit: ${GH_SHA}" \
            "Source workflow: ${GH_URL}")"

          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --repo "${GH_REPO}" --title "${title}" --body "${body}"
            for label in semver:patch semver:minor semver:major; do
              if [ "${label}" != "${resolved_label}" ]; then
                gh pr edit "${existing_pr}" --repo "${GH_REPO}" --remove-label "${label}" >/dev/null 2>&1 || true
              fi
            done
            gh pr edit "${existing_pr}" --repo "${GH_REPO}" --add-label "${resolved_label}"
            exit 0
          fi

          if [ "$(git rev-list --count origin/staging..HEAD)" = "0" ]; then
            echo "No commits between staging and dev; skipping dev -> staging promotion PR."
            exit 0
          fi

          gh pr create \
            --repo "${GH_REPO}" \
            --base staging \
            --head dev \
            --title "${title}" \
            --body "${body}" \
            --label "${resolved_label}"

  promote-staging-to-main:
    # Promotion must depend on repo-owned quality checks, not on live Incident IQ
    # smoke tests. Live integration credentials can expire or be tenant-scoped,
    # and a 401 from that external system should not prevent creating the
    # staging -> main review PR after staging has passed the deterministic
    # package/test/lint gate.
    if: github.event.workflow_run.name == 'quality' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7  # TODO: pin to specific SHA for reproducibility
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7  # TODO: pin to specific SHA for reproducibility
        with:
          python-version: "3.14"

      - name: Wait for unit check on staging commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for _attempt in $(seq 1 20); do
            conclusion="$(gh api "repos/${GH_REPO}/commits/${GH_SHA}/check-runs" --jq '.check_runs[] | select(.name=="unit") | .conclusion' | head -n 1 || true)"
            if [ "${conclusion}" = "success" ]; then
              exit 0
            fi
            if [ -n "${conclusion}" ] && [ "${conclusion}" != "null" ]; then
              echo "Unit check concluded with ${conclusion}; staging promotion will not open."
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for the unit check on ${GH_SHA}."
          exit 1

      - name: Create or refresh staging to main promotion PR
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_URL: ${{ github.event.workflow_run.html_url }}
          GH_PROMOTION_REF: promote/staging-to-main
        run: |
          set -euo pipefail

          git fetch origin main
          # The resolver shells out to gh, which reads GH_TOKEN/GITHUB_TOKEN.
          export GH_TOKEN="${GH_API_TOKEN}"
          resolved_label="$(python scripts/resolve_promotion_semver.py --repo "${GH_REPO}" --sha "${GH_SHA}" --base-ref staging)"

          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "No commits between main and staging; skipping staging -> main promotion PR."
            exit 0
          fi

          # main has no direct-push bypass, so promotion happens through a disposable branch
          # that carries the release version bump before the PR is merged.
          #
          # The branch is prepared HERE rather than by prepare-release-promotion.
          # That workflow runs on pull_request_target, and a PR opened or updated
          # with github.token does not create pull_request_target runs, so it only
          # ever fired when a human touched the promotion PR. Preparing in this
          # workflow_run job - which is triggered by the quality run, not by a
          # token-authored PR event - makes an unattended promotion produce a
          # branch that release-prep can verify. prepare-release-promotion is kept
          # for the case it still covers: a human changing the semver label after
          # the PR exists, which changes the target version.
          #
          # Push over Git with the token in the URL: the token can push refs over
          # Git even when the REST Git refs API rejects it with HTTP 403.
          part="${resolved_label#semver:}"
          git fetch origin main staging
          # The promotion ref may not exist yet on a first promotion.
          git fetch origin "${GH_PROMOTION_REF}:refs/remotes/origin/${GH_PROMOTION_REF}" || true
          current_version="$(python -c 'import subprocess, tomllib; print(tomllib.loads(subprocess.check_output(["git", "show", "origin/main:pyproject.toml"], text=True))["project"]["version"])')"
          desired_version="$(python scripts/bump_version.py --part "${part}" --current-version "${current_version}")"

          if git rev-parse --verify --quiet "origin/${GH_PROMOTION_REF}" >/dev/null; then
            prepared_version="$(python -c 'import subprocess, sys, tomllib; print(tomllib.loads(subprocess.check_output(["git", "show", sys.argv[1] + ":pyproject.toml"], text=True))["project"]["version"])' "origin/${GH_PROMOTION_REF}")"
            if [ "${prepared_version}" = "${desired_version}" ] \
              && git merge-base --is-ancestor origin/staging "origin/${GH_PROMOTION_REF}" \
              && git merge-base --is-ancestor origin/main "origin/${GH_PROMOTION_REF}"; then
              echo "Promotion branch already prepared for v${desired_version}; leaving it alone."
              prepared_ref_is_current=1
            fi
          fi

          if [ "${prepared_ref_is_current:-0}" != "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --detach origin/main
            if ! git merge --no-commit --no-ff "${GH_SHA}"; then
              unresolved_conflicts="$(git diff --name-only --diff-filter=U)"
              echo "Merge from staging into the promotion branch has unresolved conflicts:"
              printf '%s\n' "${unresolved_conflicts}"
              exit 1
            fi

            new_version="$(python scripts/bump_version.py --part "${part}" --write)"
            if [ "${new_version}" != "${desired_version}" ]; then
              echo "Prepared version ${new_version} did not match expected ${desired_version}."
              exit 1
            fi

            git add pyproject.toml src/incident_py_q/version.py
            git commit -m "Prepare release v${new_version} [skip prepare-release-promotion]"
            git push "https://x-access-token:${GH_API_TOKEN}@github.com/${GH_REPO}.git" \
              HEAD:"refs/heads/${GH_PROMOTION_REF}" \
              --force
          fi

          existing_pr="$(gh pr list --repo "${GH_REPO}" --base main --head "${GH_PROMOTION_REF}" --state open --json number --jq '.[0].number')"
          title="Promote staging to main"
          body="$(printf '%s\n' \
            'Automated promotion PR from staging to main.' \
            '' \
            "Source commit: ${GH_SHA}" \
            "Source workflow: ${GH_URL}" \
            '' \
            'This PR must carry exactly one release label: semver:patch, semver:minor, or semver:major.' \
            "The release-prep workflow rewrites ${GH_PROMOTION_REF} from staging and applies the version bump before merge.")"

          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --repo "${GH_REPO}" --title "${title}" --body "${body}"
            for label in semver:patch semver:minor semver:major; do
              if [ "${label}" != "${resolved_label}" ]; then
                gh pr edit "${existing_pr}" --repo "${GH_REPO}" --remove-label "${label}" >/dev/null 2>&1 || true
              fi
            done
            gh pr edit "${existing_pr}" --repo "${GH_REPO}" --add-label "${resolved_label}"
            exit 0
          fi

          gh pr create \
            --repo "${GH_REPO}" \
            --base main \
            --head "${GH_PROMOTION_REF}" \
            --title "${title}" \
            --body "${body}" \
            --label "${resolved_label}"
